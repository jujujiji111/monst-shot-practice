<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モンスト ショット練習場</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--panel2:#273449;--line:#3c4b60;--text:#f8fafc;--muted:#aebbd0;--accent:#facc15;--blue:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0b1220,#182438);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto;padding:22px}
h1{font-size:clamp(22px,4vw,30px);margin:0 0 16px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.stage-card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 30px #0003}
.stage-wrap{width:100%;aspect-ratio:9/16;max-height: min(78vh,850px);margin:auto;position:relative;overflow:hidden;border-radius:10px;background:#26364b;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.controls{display:grid;gap:12px}
.group{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.group h2{font-size:15px;margin:0 0 10px}
button,.file-button{border:1px solid #52647d;background:#33445d;color:white;border-radius:9px;padding:9px 12px;font:inherit;cursor:pointer}
button:hover,.file-button:hover{background:#405775}
button:active{transform:translateY(1px)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row button{min-width:42px}
.value{font-weight:700;min-width:58px;text-align:center}
.small{font-size:12px;color:var(--muted);line-height:1.55}
.stat{font-size:14px;font-weight:650;line-height:1.8}
.pad{display:grid;grid-template-columns:repeat(3,42px);gap:5px;justify-content:center}
.pad button{height:38px;padding:0}
.pad .blank{visibility:hidden}
.wide{width:100%}
input[type=file]{display:none}
input[type=range]{width:100%;accent-color:var(--accent)}
@media(max-width:760px){main{padding:12px}.layout{grid-template-columns:1fr}.stage-wrap{max-height:68vh}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.group:last-child{grid-column:1/-1}}
@media(max-width:440px){.controls{grid-template-columns:1fr}.group:last-child{grid-column:auto}}
</style>
</head>
<body>
<main>
  <h1>モンスト ショット練習場</h1>
  <div class="layout">
    <section class="stage-card">
      <div class="stage-wrap" id="stageWrap"><canvas id="stage" width="540" height="960" aria-label="ショット練習エリア"></canvas></div>
      <p class="small">円をドラッグ：位置調整 ／ 円以外をドラッグ：角度調整<br>黄色い点線は指定した反射数までの予測線です。</p>
    </section>
    <aside class="controls">
      <section class="group">
        <h2>背景画像</h2>
        <label class="file-button wide" style="display:block;text-align:center">背景画像を選択<input id="bgFile" type="file" accept="image/*"></label>
        <button id="clearBg" class="wide" style="margin-top:8px">背景を消去</button>
      </section>
      <section class="group">
        <h2>反射数</h2>
        <div class="row" style="justify-content:center">
          <button id="bounceMinus" aria-label="反射数を減らす">−</button>
          <span class="value" id="bounceValue">1回</span>
          <button id="bouncePlus" aria-label="反射数を増やす">＋</button>
        </div>
      </section>
      <section class="group">
        <h2>位置調整（1px）</h2>
        <div class="pad">
          <span class="blank"></span><button data-move="0,-1">↑</button><span class="blank"></span>
          <button data-move="-1,0">←</button><button id="centerPos">●</button><button data-move="1,0">→</button>
          <span class="blank"></span><button data-move="0,1">↓</button><span class="blank"></span>
        </div>
      </section>
      <section class="group">
        <h2>角度調整（1段階）</h2>
        <div class="row" style="justify-content:center">
          <button id="angleMinus">−</button>
          <span class="value" id="angleValue">128 / 1024</span>
          <button id="anglePlus">＋</button>
        </div>
        <input id="angleRange" type="range" min="0" max="1023" value="128">
        <div class="small">0〜1023 / 1024段階</div>
      </section>
      <section class="group">
        <button id="resetPos" class="wide">位置リセット</button>
        <button id="resetAngle" class="wide" style="margin-top:7px">角度リセット</button>
        <button id="resetBounce" class="wide" style="margin-top:7px">反射数リセット</button>
      </section>
      <section class="group">
        <div class="stat" id="stats">中心：X 230 / Y 624<br>角度：128 / 1024</div>
      </section>
    </aside>
  </div>
</main>
<script>
(() => {
 const canvas=document.getElementById('stage'), ctx=canvas.getContext('2d');
 const W=canvas.width,H=canvas.height, radius=17;
 const initial={x:230,y:624,angle:128,bounces:1};
 let x=initial.x,y=initial.y,angle=initial.angle,bounces=initial.bounces,bg=null;
 let drag=null,last={x:0,y:0};
 const $=id=>document.getElementById(id);
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 function angleRad(){return angle/1024*Math.PI*2}
 function drawBackground(){
   ctx.fillStyle='#26364b';ctx.fillRect(0,0,W,H);
   if(bg){
     const scale=Math.max(W/bg.width,H/bg.height),dw=bg.width*scale,dh=bg.height*scale;
     ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh);
     ctx.fillStyle='rgba(8,15,28,.13)';ctx.fillRect(0,0,W,H);
   } else {
     ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
     for(let gx=0;gx<=W;gx+=45){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}
     for(let gy=0;gy<=H;gy+=45){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}
     ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 24px system-ui';ctx.textAlign='center';
     ctx.fillText('背景画像を選択してください',W/2,H/2);
   }
 }
 function trace(){
   let px=x,py=y,dx=Math.cos(angleRad()),dy=-Math.sin(angleRad());
   const points=[[px,py]];
   for(let i=0;i<bounces+1;i++){
     let tx=Infinity,ty=Infinity;
     if(dx>0)tx=(W-radius-px)/dx;else if(dx<0)tx=(radius-px)/dx;
     if(dy>0)ty=(H-radius-py)/dy;else if(dy<0)ty=(radius-py)/dy;
     const t=Math.max(0,Math.min(tx,ty));
     if(!Number.isFinite(t))break;
     px+=dx*t;py+=dy*t;points.push([px,py]);
     if(i===bounces)break;
     if(Math.abs(tx-ty)<.0001){dx=-dx;dy=-dy}
     else if(tx<ty)dx=-dx;else dy=-dy;
     // Nudge inward to avoid repeatedly detecting the same boundary.
     px=clamp(px+dx*.01,radius,W-radius);py=clamp(py+dy*.01,radius,H-radius);
   }
   return points;
 }
 function render(){
   drawBackground();
   const pts=trace();
   ctx.save();ctx.setLineDash([5,8]);ctx.strokeStyle='#ffe34d';ctx.lineWidth=3;ctx.lineCap='round';
   ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();
   // Direction indicator
   const a=angleRad(), ex=x+Math.cos(a)*54,ey=y-Math.sin(a)*54;
   ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,radius+4,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#082f49';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.stroke();
   ctx.fillStyle='#082f49';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
   $('bounceValue').textContent=bounces+'回';$('angleValue').textContent=angle+' / 1024';$('angleRange').value=angle;
   $('stats').innerHTML=`中心：X ${Math.round(x)} / Y ${Math.round(y)}<br>角度：${angle} / 1024`;
 }
 function update(){x=clamp(x,radius,W-radius);y=clamp(y,radius,H-radius);angle=(angle+1024)%1024;bounces=clamp(bounces,0,20);render()}
 function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
 canvas.addEventListener('pointerdown',e=>{const p=pointerPos(e);drag=Math.hypot(p.x-x,p.y-y)<=radius+12?'position':'angle';last=p;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=pointerPos(e);if(drag==='position'){x+=p.x-last.x;y+=p.y-last.y}else{const a0=Math.atan2(-(last.y-y),last.x-x),a1=Math.atan2(-(p.y-y),p.x-x);angle=Math.round((angle+(a1-a0)*1024/(Math.PI*2)+1024*4))%1024}last=p;update()});
 canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
 $('bgFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{bg=im;render();URL.revokeObjectURL(url)};im.src=url});
 $('clearBg').onclick=()=>{bg=null;$('bgFile').value='';render()};
 $('bounceMinus').onclick=()=>{bounces--;update()};$('bouncePlus').onclick=()=>{bounces++;update()};
 document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.move.split(',').map(Number);x+=dx;y+=dy;update()});
 $('centerPos').onclick=()=>{x=initial.x;y=initial.y;update()};
 $('angleMinus').onclick=()=>{angle--;update()};$('anglePlus').onclick=()=>{angle++;update()};
 $('angleRange').oninput=e=>{angle=Number(e.target.value);update()};
 $('resetPos').onclick=()=>{x=initial.x;y=initial.y;update()};
 $('resetAngle').onclick=()=>{angle=initial.angle;update()};
 $('resetBounce').onclick=()=>{bounces=initial.bounces;update()};
 update();
})();
</script>
</body>
</html>
