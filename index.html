<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>モンスト ショット練習場</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f8fafc;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:18px}h1{font-size:26px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.stage-card,.group{background:#1f2937;border:1px solid #46566d;border-radius:13px;padding:12px}.stage-wrap{width:100%;aspect-ratio:9/16;max-height:75vh;margin:auto;overflow:hidden;border-radius:9px;background:#111827}canvas{width:100%;height:100%;display:block;touch-action:none}.controls{display:grid;gap:10px}.group{background:#273449}.group h2{font-size:15px;margin:0 0 9px}button,.file-button{background:#354860;color:white;border:1px solid #60738c;border-radius:8px;padding:9px 12px;font:inherit}button{cursor:pointer}.wide{width:100%}.row{display:flex;align-items:center;justify-content:center;gap:9px}.value{min-width:85px;text-align:center;font-weight:bold}.small{font-size:12px;color:#bdc9d9;line-height:1.6}.stat{line-height:1.8;font-weight:bold}.pad{display:grid;grid-template-columns:repeat(3,42px);gap:5px;justify-content:center}.pad button{height:38px;padding:0}.blank{visibility:hidden}input[type=file]{display:none}input[type=range]{width:100%;accent-color:#facc15}@media(max-width:740px){main{padding:12px}.layout{grid-template-columns:1fr}.stage-wrap{max-height:65vh}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){.controls{grid-template-columns:1fr}}
</style></head><body><main><h1>モンスト ショット練習場</h1><div class="layout">
<section class="stage-card"><div class="stage-wrap"><canvas id="stage" width="540" height="960"></canvas></div><p class="small">円をドラッグ：位置調整 ／ 円以外をドラッグ：角度調整<br>黄色い点線は指定した反射数までの予測線です。</p></section>
<aside class="controls">
<section class="group"><h2>背景画像</h2><label class="file-button wide" style="display:block;text-align:center">背景画像を選択<input id="bgFile" type="file" accept="image/*"></label><button id="clearBg" class="wide" style="margin-top:8px">背景を消去</button></section>
<section class="group"><h2>反射数</h2><div class="row"><button id="bm">−</button><span class="value" id="bv">1回</span><button id="bp">＋</button></div></section>
<section class="group"><h2>位置調整（1px）</h2><div class="pad"><i class="blank"></i><button data-m="0,-1">↑</button><i class="blank"></i><button data-m="-1,0">←</button><button id="center">●</button><button data-m="1,0">→</button><i class="blank"></i><button data-m="0,1">↓</button><i class="blank"></i></div></section>
<section class="group"><h2>角度調整（1段階）</h2><div class="row"><button id="am">−</button><span class="value" id="av">128 / 1024</span><button id="ap">＋</button></div><input id="range" type="range" min="0" max="1023" value="128"><div class="small">0〜1023 / 1024段階</div></section>
<section class="group"><button id="rp" class="wide">位置リセット</button><button id="ra" class="wide" style="margin-top:6px">角度リセット</button><button id="rb" class="wide" style="margin-top:6px">反射数リセット</button></section>
<section class="group"><div class="stat" id="stats">中心：X 230 / Y 624<br>角度：128 / 1024</div></section>
</aside></div></main>
<script>
(()=>{const c=document.getElementById('stage'),ctx=c.getContext('2d'),W=540,H=960,R=17,$=id=>document.getElementById(id);let x=230,y=624,a=128,n=1,bg=null,drag=null,last={x:0,y:0};
function drawBg(){ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);if(bg){/* 画像全体を表示し、縦横比を維持。端を切り取りません */const s=Math.min(W/bg.width,H/bg.height),w=bg.width*s,h=bg.height*s;ctx.drawImage(bg,(W-w)/2,(H-h)/2,w,h)}else{ctx.strokeStyle='#ffffff16';for(let xx=0;xx<W;xx+=45){ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx,H);ctx.stroke()}for(let yy=0;yy<H;yy+=45){ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('背景画像を選択してください',W/2,H/2)}}
function path(){let px=x,py=y,dx=Math.cos(a*Math.PI*2/1024),dy=-Math.sin(a*Math.PI*2/1024),p=[[px,py]];for(let i=0;i<=n;i++){let tx=dx>0?(W-R-px)/dx:dx<0?(R-px)/dx:Infinity,ty=dy>0?(H-R-py)/dy:dy<0?(R-py)/dy:Infinity,t=Math.min(tx,ty);if(!Number.isFinite(t))break;px+=dx*t;py+=dy*t;p.push([px,py]);if(i===n)break;if(Math.abs(tx-ty)<.0001){dx=-dx;dy=-dy}else if(tx<ty)dx=-dx;else dy=-dy;px=Math.max(R,Math.min(W-R,px+dx*.01));py=Math.max(R,Math.min(H-R,py+dy*.01))}return p}
function render(){drawBg();let p=path();ctx.save();ctx.setLineDash([5,8]);ctx.strokeStyle='#ffe34d';ctx.lineWidth=3;ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));ctx.stroke();ctx.restore();let rad=a*Math.PI*2/1024;ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(rad)*54,y-Math.sin(rad)*54);ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.arc(x,y,R+4,0,7);ctx.fill();ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();ctx.fillStyle='#082f49';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();$('bv').textContent=n+'回';$('av').textContent=a+' / 1024';$('range').value=a;$('stats').innerHTML=`中心：X ${Math.round(x)} / Y ${Math.round(y)}<br>角度：${a} / 1024`}
function update(){x=Math.max(R,Math.min(W-R,x));y=Math.max(R,Math.min(H-R,y));a=(a+1024)%1024;n=Math.max(0,Math.min(20,n));render()}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.onpointerdown=e=>{let p=pos(e);drag=Math.hypot(p.x-x,p.y-y)<R+12?'pos':'angle';last=p;c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!drag)return;let p=pos(e);if(drag==='pos'){x+=p.x-last.x;y+=p.y-last.y}else{let q=Math.atan2(-(last.y-y),last.x-x),z=Math.atan2(-(p.y-y),p.x-x);a=Math.round(a+(z-q)*1024/(2*Math.PI)+4096)%1024}last=p;update()};c.onpointerup=c.onpointercancel=()=>drag=null;
$('bgFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{bg=im;render();URL.revokeObjectURL(u)};im.onerror=()=>alert('画像を読み込めませんでした');im.src=u};
$('clearBg').onclick=()=>{bg=null;$('bgFile').value='';render()};$('bm').onclick=()=>{n--;update()};$('bp').onclick=()=>{n++;update()};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{let d=b.dataset.m.split(',').map(Number);x+=d[0];y+=d[1];update()});
$('center').onclick=$('rp').onclick=()=>{x=230;y=624;update()};$('am').onclick=()=>{a--;update()};$('ap').onclick=()=>{a++;update()};$('range').oninput=e=>{a=+e.target.value;update()};
$('ra').onclick=()=>{a=128;update()};$('rb').onclick=()=>{n=1;update()};update()})();
</script></body></html>
